<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级意见反馈平台</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f7f8fa;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 2px 12px #00000014;
        }
        h1 {
            text-align:center;
            color:#222;
            font-size:24px;
        }
        .tip {
            color:#555;
            text-align:center;
            margin-bottom:24px;
        }
        .radio-line {
            margin-bottom:20px;
        }
        label {
            display:block;
            margin-top:16px;
            font-weight:500;
            color:#333;
        }
        input, textarea {
            width:100%;
            padding:10px 12px;
            margin-top:6px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:16px;
        }
        textarea {
            min-height:160px;
            resize:vertical;
        }
        button {
            width:100%;
            padding:12px;
            margin-top:22px;
            background:#3b82f6;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
        }
        button:hover {
            background:#2563eb;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>班级意见反馈平台</h1>
    <div class="tip">你可以选择匿名或者实名提交，所有反馈我都会查看并跟进</div>

    <form action="https://formsubmit.co/85992dce01d8ba7cf852ad5688bde794" method="POST">
        <!-- 提交成功跳转到提示文字页面 -->
        <input type="hidden" name="_redirect" value="https://hydrologic0306.github.io/class-feedback-platform/?ok=1">
        <input type="hidden" name="_autoresponse" value="">

        <div class="radio-line">
            <p>提交方式：</p>
            <input type="radio" id="anonymous" name="type" value="匿名反馈" checked>
            <label for="anonymous">匿名提交（不填写姓名）</label>
            <input type="radio" id="realname" name="type" value="实名反馈">
            <label for="realname">实名提交（留下姓名，方便后续沟通）</label>
        </div>

        <label for="name">姓名（匿名可以留空）</label>
        <input type="text" name="name" id="name" placeholder="匿名提交不用填写">

        <label for="contact">联系方式（可选）</label>
        <input type="text" name="contact" id="contact" placeholder="QQ/微信，方便我回复你">

        <label for="message">反馈内容（必填）</label>
        <textarea name="message" id="message" placeholder="写下你的建议、问题或者想法..." required></textarea>

        <button type="submit">提交反馈</button>
    </form>
</div>
</body>
</html>
