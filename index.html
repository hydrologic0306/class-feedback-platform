<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班级意见反馈平台</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f7f8fa;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        h1 {
            text-align:center;
            color:#222;
        }
        .tip {
            text-align:center;
            margin-bottom:24px;
            color:#555;
        }
        .radio-line {
            margin-bottom:20px;
        }
        label {
            display:block;
            margin-top:16px;
            font-weight:500;
            color:#333;
        }
        input, textarea {
            width:100%;
            padding:10px 12px;
            margin-top:6px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:16px;
        }
        textarea {
            min-height:160px;
            resize:vertical;
        }
        button {
            width:100%;
            padding:12px;
            margin-top:22px;
            background:#3b82f6;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
        }
        button:hover {
            background:#2563eb;
        }
        .success {
            color:#22a75d;
            text-align:center;
            font-size:18px;
            display:none;
        }
    </style>
</head>
<body>
<div class="box">
    <h1>班级意见反馈平台</h1>
    <div class="tip">你可以选择匿名或者实名提交，所有意见我都会查看跟进</div>

    <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="f50ad36d-6d00-4ba2-843e-5594134e258d">
        <input type="hidden" name="subject" value="班级新反馈">

        <div class="radio-line">
            <p>提交方式：</p>
            <input type="radio" id="anonymous" name="type" value="匿名反馈" checked>
            <label for="anonymous">匿名提交（不填写姓名）</label>
            <input type="radio" id="realname" name="type" value="实名反馈">
            <label for="realname">实名提交（留下姓名，方便沟通）</label>
        </div>

        <label for="name">姓名（匿名可以留空）</label>
        <input type="text" name="name" id="name" placeholder="匿名提交不用填写">

        <label for="contact">联系方式（可选）</label>
        <input type="text" name="contact" id="contact" placeholder="QQ/微信，想回复你的话填写">

        <label for="message">反馈内容（必填）</label>
        <textarea name="message" id="message" placeholder="写下你的建议、想法、问题..." required></textarea>

        <button type="submit">提交反馈</button>
    </form>
    <div class="success" id="msg">✅ 提交成功！感谢你的反馈</div>
</div>

<script>
const form = document.querySelector('form');
form.addEventListener('submit', async function(e){
    e.preventDefault();
    const formData = new FormData(form);
    const res = await fetch(form.action, {
        method: form.method,
        body: formData
    });
    const result = await res.json();
    if(result.success){
        document.getElementById('msg').style.display="block";
        form.reset();
    }
})
</script>
</body>
</html>
