<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会计264班级意见反馈平台</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #e8f5ee 0%, #f1f8f4 45%, #e6f4ef 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        .header-card {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-card h1 {
            font-size: 24px;
            color: #1f4d3a;
            margin: 0 0 10px;
            font-weight: 600;
        }

        .header-card p {
            color: #4a6b5f;
            font-size: 15px;
            margin: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.28);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 32px;
            border-radius: 22px;
            box-shadow: 0 12px 30px rgba(34, 85, 66, 0.08);
            transition: 0.3s ease;
            margin-bottom: 28px;
        }

        .card:hover {
            box-shadow: 0 16px 36px rgba(34, 85, 66, 0.12);
            transform: translateY(-2px);
        }

        .card h2 {
            margin-top: 0;
            color: #1f4d3a;
            font-size: 20px;
        }

        .feedback-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid rgba(31, 77, 58, 0.08);
        }

        .feedback-item:last-child {
            border-bottom: none;
        }

        .status-pending {
            color: #7a5c1f;
            background: rgba(255, 241, 204, 0.85);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .status-done {
            color: #1f4d3a;
            background: rgba(209, 235, 222, 0.85);
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 14px;
        }

        .tip-text {
            font-size: 14px;
            color: #4a6b5f;
            margin-top: 16px;
            line-height: 1.6;
        }

        .radio-line {
            margin-bottom: 24px;
        }

        .radio-line p {
            font-weight: 500;
            color: #2f4f44;
            margin-bottom: 10px;
        }

        .radio-item {
            display: inline-block;
            margin-right: 24px;
            cursor: pointer;
            color: #2f4f44;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 500;
            color: #2f4f44;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 16px;
            margin-top: 8px;
            border: 1px solid rgba(186, 211, 198, 0.6);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.45);
            color: #2f4f44;
            transition: 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #6aa98b;
            box-shadow: 0 0 0 3px rgba(106, 169, 139, 0.25);
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: linear-gradient(90deg, #5f9f7f, #3c7f66);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.92;
            transform: translateY(-2px);
        }

        .success {
            color: #1f4d3a;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
            margin-top: 20px;
            display: none;
            background: rgba(209, 235, 222, 0.85);
            padding: 14px;
            border-radius: 12px;
        }

        .footer-tip {
            text-align: center;
            margin-top: 24px;
            color: #4a6b5f;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <h1>会计264班级意见反馈平台</h1>
            <p>你的声音，会被认真听见</p>
        </div>

        <div class="card">
            <h2>反馈处理进度公示</h2>

            <div class="feedback-item">
                <span>【示例#001】自习环境优化建议</span>
                <span class="status-pending">处理中</span>
            </div>

            <p class="tip-text">
                目前公示示例仅展示一条。提交反馈后请保存工单编号，后续可在此查看处理进度。
            </p>
        </div>

        <div class="card">
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="f50ad36d-6d00-4ba2-843e-5594134e258d">
                <input type="hidden" name="subject" value="会计264班级反馈">
                <input type="hidden" id="ticket_id" name="工单编号">

                <label for="category">反馈分类</label>
                <select name="category" id="category" required>
                    <option value="">请选择分类</option>
                    <option value="班级活动建议">班级活动建议</option>
                    <option value="学习相关">学习相关</option>
                    <option value="班级管理">班级管理意见</option>
                    <option value="其他想法">其他想法</option>
                </select>

                <div class="radio-line">
                    <p>提交方式</p>
                    <label class="radio-item">
                        <input type="radio" name="type" value="匿名反馈" checked> 匿名反馈
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="type" value="实名反馈"> 实名反馈
                    </label>
                </div>

                <label for="name">姓名（匿名可以留空）</label>
                <input type="text" name="name" id="name" placeholder="匿名提交不用填写">

                <label for="contact">联系方式（选填）</label>
                <input type="text" name="contact" id="contact" placeholder="想收到回复可以填写QQ">

                <label for="message">你的意见 / 建议（必填）</label>
                <textarea name="message" id="message" placeholder="写下你的想法..." required></textarea>

                <button type="submit">提交反馈</button>
            </form>

            <div class="success" id="msg"></div>
        </div>

        <p class="footer-tip">
            所有反馈会被妥善记录，相关内容仅用于班级意见整理与改进。
        </p>
    </div>

    <script>
        function genTicketID() {
            return '#' + Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
        }

        let tid = genTicketID();
        document.getElementById('ticket_id').value = tid;

        const form = document.querySelector('form');
        const msgBox = document.getElementById('msg');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(form);

            try {
                const res = await fetch(form.action, {
                    method: form.method,
                    body: formData
                });

                const result = await res.json();

                if (result.success) {
                    msgBox.style.display = "block";
                    msgBox.innerHTML = `提交成功！你的工单编号：<strong>${tid}</strong><br>请保存编号，后续可在公示区查看处理进度。`;
                    form.reset();
                    tid = genTicketID();
                    document.getElementById('ticket_id').value = tid;
                } else {
                    msgBox.style.display = "block";
                    msgBox.textContent = "提交失败，请稍后重试。";
                }
            } catch (err) {
                msgBox.style.display = "block";
                msgBox.textContent = "网络异常，请稍后重试。";
            }
        });
    </script>
</body>
</html>
