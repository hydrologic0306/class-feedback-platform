<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>会计264班级意见反馈平台</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background: linear-gradient(135deg, #B8DFD3 0%, #CDECE2 45%, #D7F3E8 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
        }

        .header-card {
            text-align: center;
            margin-bottom: 28px;
        }

        .header-card h1 {
            font-size: 24px;
            color: #7C9B87;
            margin: 0 0 10px;
            font-weight: 600;
        }

        .header-card p {
            color: #55746A;
            font-size: 15px;
            margin: 0;
        }

        /* ===== Lumno liquid glass start ===== */
        /* Lumno's liquid glass, from Glasswork (https://www.kubai.design/glasswork/).
           Light glass with dark ink by default; .glass.is-dark for dark glass with light ink.
           If Safari leaves a surface with busy content undrawn, move background and
           backdrop-filter to a ::before under the content, as glass.css in the repo does. */

        .glass {
          border-radius: 28px;
          corner-shape: superellipse(1.25);
        }
        /* Capsules keep round ends. */
        .glass.is-pill { border-radius: 999px; corner-shape: round; }

        .glass {
          background: rgb(235 226 255 / 0);
          -webkit-backdrop-filter: blur(2px) saturate(240%) brightness(1);
          backdrop-filter: blur(2px) saturate(240%) brightness(1) var(--glass-lens,);
          box-shadow:
            inset 1.5px 1.5px 1px -1px rgb(255 255 255 / 1),
            inset -1.5px -1.5px 1px -1px rgb(255 255 255 / 0.6),
            inset 0 0 0 0.5px rgb(255 255 255 / 0.3),
            0 0 0 0.5px rgb(0 0 0 / 0.12),
            0 4px 16px rgb(0 0 0 / 0.1),
            inset 0 6px 8px -6px rgb(255 255 255 / 0),
            inset 4px 0 8px -6px rgb(255 255 255 / 0),
            inset -4px 0 8px -6px rgb(255 255 255 / 0),
            inset 0 -6px 8px -6px rgb(0 0 0 / 0);
          color: rgb(0 0 0 / 0.86);
          padding: 32px;
          transition: 0.3s ease;
          margin-bottom: 28px;
        }
        .glass:hover {
            transform: translateY(-2px);
        }
        .glass > * { mix-blend-mode: multiply; }
        .glass .secondary { color: rgb(60 60 67 / 0.7); }

        .glass.is-dark {
          background: rgb(30 30 34 / 0.241);
          -webkit-backdrop-filter: blur(2px) saturate(220%) brightness(0.8);
          backdrop-filter: blur(2px) saturate(220%) brightness(0.8) var(--glass-lens,);
          box-shadow:
            inset 1px 1px 0.5px -0.5px rgb(255 255 255 / 0.46),
            inset -1px -1px 0.5px -0.5px rgb(255 255 255 / 0.18),
            inset 0 0 0 0.5px rgb(255 255 255 / 0.06),
            0 0 0 0.5px rgb(0 0 0 / 0.28),
            0 4px 14px rgb(0 0 0 / 0.22),
            inset 0 6px 8px -6px rgb(255 255 255 / 0.18),
            inset 4px 0 8px -6px rgb(255 255 255 / 0.07),
            inset -4px 0 8px -6px rgb(255 255 255 / 0.04),
            inset 0 -6px 8px -6px rgb(0 0 0 / 0.08);
          color: rgb(255 255 255 / 0.94);
        }
        .glass.is-dark > * { mix-blend-mode: plus-lighter; }
        .glass.is-dark .secondary { color: rgb(235 235 245 / 0.64); }
        /* ===== Lumno liquid glass end ===== */

        .radio-line {
            margin-bottom: 24px;
        }

        .radio-line p {
            font-weight: 500;
            color: #44665A;
            margin-bottom: 10px;
        }

        .radio-item {
            display: inline-block;
            margin-right: 24px;
            cursor: pointer;
            color: #44665A;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: 500;
            color: #44665A;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 14px 16px;
            margin-top: 8px;
            border: 1px solid rgba(169, 204, 188, 0.7);
            border-radius: 12px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.5);
            color: #355249;
            transition: 0.2s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #6FA592;
            box-shadow: 0 0 0 3px rgba(111, 165, 146, 0.25);
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            background: linear-gradient(90deg, #6FA592, #5B8F7D);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.92;
            transform: translateY(-2px);
        }

        .success {
            color: #245F4B;
            text-align: center;
            font-size: 18px;
            font-weight: 500;
            margin-top: 20px;
            display: none;
            background: rgba(209, 235, 222, 0.9);
            padding: 14px;
            border-radius: 12px;
        }

        .footer-tip {
            text-align: center;
            margin-top: 24px;
            color: #55746A;
            font-size: 14px;
        }
        .copyright{
            text-align:center;
            margin-top:36px;
            color:#55746A;
            font-size:13px;
            line-height:1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-card">
            <h1>会计264班级意见反馈平台</h1>
            <p>你的声音，会被认真听见</p>
        </div>

        <!-- 这里替换成 glass 类 -->
        <div class="glass">
            <form action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="f50ad36d-6d00-4ba2-843e-5594134e258d">
                <input type="hidden" name="subject" value="会计264班级反馈">
                <input type="hidden" id="ticket_id" name="工单编号">

                <div class="radio-line">
                    <p>反馈分类</p>
                    <label class="radio-item">
                        <input type="radio" name="category" value="对老师课程的意见反馈" checked required> 对老师课程的意见反馈
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="category" value="对我工作方面的意见建议"> 对我工作方面的意见建议
                    </label>
                </div>

                <label for="message">你的意见 / 建议（必填）</label>
                <textarea name="message" id="message" placeholder="写下你的想法..." required></textarea>

                <button type="submit">提交反馈</button>
            </form>

            <div class="success" id="msg"></div>
        </div>

        <p class="footer-tip">
            所有反馈会被妥善记录，相关内容仅用于班级意见整理与改进。
        </p>
        <p class="copyright">©2026 会计264班级反馈平台 | Design by 郝韶茜. All rights reserved.<br>未经许可，禁止复制、盗用本页面代码与视觉排版。</p>
    </div>

    <script>
        function genTicketID() {
            return '#' + Math.floor(Math.random() * 1000000).toString().padStart(6, '0');
        }

        let tid = genTicketID();
        document.getElementById('ticket_id').value = tid;

        const form = document.querySelector('form');
        const msgBox = document.getElementById('msg');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();

            const formData = new FormData(form);

            try {
                const res = await fetch(form.action, {
                    method: form.method,
                    body: formData
                });

                const result = await res.json();

                if (result.success) {
                    msgBox.style.display = "block";
                    msgBox.innerHTML = `提交成功！你的工单编号：<strong>${tid}</strong><br>反馈已匿名记录，我会尽快整理课程相关建议反馈给专业老师，并根据意见改进学习委员工作。`;
                    form.reset();
                    tid = genTicketID();
                    document.getElementById('ticket_id').value = tid;
                } else {
                    msgBox.style.display = "block";
                    msgBox.textContent = "提交失败，请稍后重试。";
                }
            } catch (err) {
                msgBox.style.display = "block";
                msgBox.textContent = "网络异常，请稍后重试。";
            }
        });
    </script>

    <!-- Lumno liquid glass lens script -->
    <script type="module">
        import { liquidGlass } from 'https://cdn.jsdelivr.net/gh/kubai087/glasswork@v1.1.0/lens.js';
        for (const el of document.querySelectorAll('.glass')) liquidGlass(el, { rim: 40, edge: 1.1, power: 2.6, dispersion: 0.22 });
    </script>
</body>
</html>
